[package]
name = "work"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["core/*"]

[workspace.dependencies]
figment = { version = "0.10", features = ["env", "toml"] }
serde = { version = "1.0" }
thiserror = { version = "2.0" }
anyhow = { version = "1" }
tracing = { version = "0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = [
    "std",
    "fmt",
    "env-filter",
    "tracing-log",
    "time",
    "local-time",
    "json",
] }
time = { version = "0.3" }
validator = { version = "0.20", features = ["derive"] }
tokio = { version = "1.48", features = ["full"] }
salvo = { version = "0.87", features = ["full"] }
sea-orm = { version = "1.1", "features" = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "sqlx-postgres",
] }
jsonwebtoken = { version = "10.2", features = ["rust_crypto"]}
rust-embed = { version = "8.9" }
tera = { version = "1.20" }
argon2 = { version = "0.5" }
blake3 = { version = "1.8" }
rand = { version = "0.9" }

[dependencies]
mimalloc = { version = "0.1", default-features = false }
tokio = { workspace = true }

api = { path = "core/api" }
config = { path = "core/config" }
db = { path = "core/db" }
dto = { path = "core/dto" }
entity = { path = "core/entity" }
hoop = { path = "core/hoop" }
util = { path = "core/util" }
common = { path = "core/common" }


[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
